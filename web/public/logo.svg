<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff41;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#000000ff;stop-opacity:1" />
    </linearGradient>
    <pattern id="checkers" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#333" />
      <rect x="40" y="40" width="40" height="40" fill="#333" />
      <rect x="40" width="40" height="40" fill="#ccc" />
      <rect y="40" width="40" height="40" fill="#ccc" />
    </pattern>
  </defs>

<!-- Shield -->
  <path d="M 50 50 Q 135 50 200 10 Q 270 50 350 50 L 350 150 C 350 280 200 380 200 380 C 200 380 50 280 50 150 Z" 
        fill="url(#checkers)" stroke="#7f8c8d" stroke-width="15" stroke-linejoin="round" />
  
<!-- Shield outline -->
  <path d="M 50 50 Q 135 50 200 10 Q 270 50 350 50 L 350 150 C 350 280 200 380 200 380 C 200 380 50 280 50 150 Z" 
        fill="url(#shieldGrad)" stroke="#000000ff" stroke-width="5" />

  <rect x="140" y="100" width="120" height="180" rx="10" ry="10" fill="#8d6e63" stroke="#5d4037" stroke-width="4" />
  <rect x="150" y="110" width="100" height="160" rx="5" ry="5" fill="#d7ccc8" opacity="0.4" />
  <ellipse cx="200" cy="190" rx="35" ry="50" fill="#5d4037" />

</svg>